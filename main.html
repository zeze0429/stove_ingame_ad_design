<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOVE 인게임광고 — 데스크톱 미리보기</title>
  <link rel="stylesheet" href="css/typography.css?v=1" />
  <link rel="stylesheet" href="css/desktop.css?v=13" />
</head>
<body>
  <div class="os-desktop">

    <div class="os-window-group">
      <!-- 게임 창모드 (960 x 540) -->
      <div class="os-window">
        <div class="os-window__titlebar">
          <div class="os-window__titlebar-left">
            <img class="os-window__icon" src="assets/game_icon.png" alt="" />
            <span class="os-window__title">Teleport Master</span>
          </div>
          <div class="os-window__titlebar-btns">
            <button class="os-window__btn os-window__btn--min" title="최소화">
              <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg>
            </button>
            <button class="os-window__btn os-window__btn--max" title="최대화">
              <svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg>
            </button>
            <button class="os-window__btn os-window__btn--close" title="닫기">
              <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor"/></svg>
            </button>
          </div>
        </div>
        <video
          class="os-content os-content--video"
          src="assets/gameplay.mp4"
          autoplay
          muted
          loop
          playsinline
          disablepictureinpicture
          disableremoteplayback
        ></video>
      </div>

      <!-- 인게임광고 영역 (1100 x 90) — 이미지 4장 롤링 + 우측 원형 로딩 게이지 + 카운터 -->
      <div class="ingame-ad-slot" id="ingameAdSlot">
        <img class="ingame-ad-slot__image" id="ingameAdImage" src="assets/AD/1.png" alt="" />
        <div class="ingame-ad-slot__meter">
          <span class="ingame-ad-slot__count" id="ingameAdCount">0</span>
          <svg class="ingame-ad-slot__ring" viewBox="0 0 36 36" width="36" height="36">
            <circle class="ingame-ad-slot__ring-bg" cx="18" cy="18" r="15" />
            <circle class="ingame-ad-slot__ring-fg" id="ingameAdRing" cx="18" cy="18" r="15" />
          </svg>
        </div>
      </div>
    </div>

    <!-- 작업표시줄 (PC클라이언트와 동일 — Figma Make 레퍼런스: https://quartz-unique-70171087.figma.site/ 그대로 재현) -->
    <div class="os-taskbar os-taskbar--light">
      <div class="os-taskbar__left">
        <button class="os-taskbar__btn" title="시작">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" fill="currentColor"/><rect x="13" y="3" width="8" height="8" fill="currentColor"/><rect x="3" y="13" width="8" height="8" fill="currentColor"/><rect x="13" y="13" width="8" height="8" fill="currentColor"/></svg>
        </button>
        <button class="os-taskbar__btn" title="검색">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </button>
        <button class="os-taskbar__btn" title="위젯">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
        </button>

        <span class="os-taskbar__divider"></span>

        <button class="os-taskbar__btn" title="STOVE">
          <span class="os-taskbar__appicon">
            <svg viewBox="0 0 256 256" fill="none"><circle cx="128" cy="128" r="128" fill="#FC4420"/><path d="M130.969 60.4746L128.749 60.4445C98.632 60.4445 77.5097 74.9797 77.5097 98.6281C77.5097 116.834 88.1032 126.644 100.991 132.918L103.043 133.88C104.768 134.658 106.524 135.38 108.294 136.055L110.423 136.845L112.558 137.596L115.754 138.656L118.921 139.651L128.958 142.681L131.719 143.56L133.472 144.151L135.147 144.751L136.737 145.365C139.827 146.609 142.362 147.96 144.08 149.571C145.595 151.061 146.542 152.44 146.542 154.861C146.542 159.929 141.131 162.362 129.685 162.362C118.961 162.362 110.634 159.731 103.942 157.181L97.4335 154.629C94.12 153.361 91.279 152.451 88.7555 152.451C80.0424 152.451 74.668 159.516 74.668 167.709C74.668 181.949 93.9618 190.044 112.535 192.748L114.9 193.064C115.686 193.16 116.47 193.246 117.249 193.322L119.571 193.522L121.857 193.664C123.368 193.74 124.848 193.778 126.287 193.778C156.782 193.778 181.335 180.558 181.335 152.44C181.335 131.286 167.823 121.675 152.787 116.086L150.729 115.348L148.658 114.656C148.312 114.544 147.966 114.434 147.62 114.325L145.544 113.693L143.473 113.096L141.413 112.53L138.359 111.73L131.522 110.013L127.883 109.073L125.323 108.362L123.71 107.877L122.178 107.378C121.93 107.294 121.686 107.208 121.446 107.122L120.051 106.595L118.756 106.043C117.305 105.384 116.071 104.666 115.102 103.859L114.471 103.331C113.91 102.826 113.451 102.307 113.096 101.783C112.187 100.447 111.874 99.3382 111.874 98.1898C111.874 93.9142 115.808 92.102 121.677 91.4762L123.324 91.334C123.888 91.2958 124.466 91.2664 125.058 91.2449L126.87 91.2031L127.802 91.1981C134.218 91.1981 139.93 92.2378 144.832 93.4023L147.425 94.0443L153.178 95.5411C155.613 96.1474 157.693 96.5685 159.39 96.5685C168.103 96.5685 173.526 90.7381 173.526 82.9173C173.526 77.8894 171.94 73.9794 168.72 70.8141C160.941 63.1666 141.938 60.7613 130.969 60.4746Z" fill="white"/></svg>
          </span>
          <span class="os-taskbar__indicator os-taskbar__indicator--running"></span>
        </button>
        <button class="os-taskbar__btn os-taskbar__btn--game is-active" title="Teleport Master">
          <span class="os-taskbar__appicon">
            <img src="assets/game_icon.png" alt="" />
          </span>
          <span class="os-taskbar__indicator os-taskbar__indicator--active"></span>
        </button>
        <button class="os-taskbar__btn" title="브라우저">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="4"></circle><line x1="21.17" x2="12" y1="8" y2="8"></line><line x1="3.95" x2="8.54" y1="6.06" y2="14"></line><line x1="10.88" x2="15.46" y1="21.94" y2="14"></line></svg>
        </button>
        <button class="os-taskbar__btn" title="파일 탐색기">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"></path></svg>
        </button>
        <button class="os-taskbar__btn" title="채팅">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </button>
      </div>

      <div class="os-taskbar__right">
        <button class="os-taskbar__tray" title="네트워크/소리/배터리">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"></path><path d="M2 8.82a15 15 0 0 1 20 0"></path><path d="M5 12.859a10 10 0 0 1 14 0"></path><path d="M8.5 16.429a5 5 0 0 1 7 0"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path><path d="M16 9a5 5 0 0 1 0 6"></path><path d="M19.364 18.364a9 9 0 0 0 0-12.728"></path></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="10" x="2" y="7" rx="2" ry="2"></rect><line x1="22" x2="22" y1="11" y2="13"></line></svg>
        </button>
        <button class="os-taskbar__clock" id="clock">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <span id="clockTime">--:--</span>
          <span class="os-taskbar__clock-divider"></span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
          <span id="clockDate" class="date">----‑--‑--</span>
        </button>
        <button class="os-taskbar__btn" title="알림">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
        </button>
      </div>
    </div>

  </div>

  <script>
    function pad(n) { return String(n).padStart(2, '0'); }
    function tick() {
      var now = new Date();
      var hour24 = now.getHours();
      var meridiem = hour24 < 12 ? '오전' : '오후';
      var hour12 = hour24 % 12 || 12;
      document.getElementById('clockTime').textContent = meridiem + ' ' + pad(hour12) + ':' + pad(now.getMinutes());
      document.getElementById('clockDate').textContent =
        now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());
    }
    tick();
    setInterval(tick, 1000 * 30);
  </script>

  <script>
    // 인게임광고 슬롯 — 이미지 4장 롤링 + 우측 원형 로딩 게이지 + 카운터
    (function () {
      var AD_IMAGES = ['assets/AD/1.png', 'assets/AD/2.png', 'assets/AD/3.png', 'assets/AD/4.png'];
      var CYCLE_MS = 5000; // 이미지 1장당 노출 시간 (임시값 — 확정되면 조정)
      var COUNT_STEP = 500;

      var imgEl = document.getElementById('ingameAdImage');
      var ringEl = document.getElementById('ingameAdRing');
      var countEl = document.getElementById('ingameAdCount');

      var RADIUS = 15;
      var CIRCUMFERENCE = 2 * Math.PI * RADIUS;
      ringEl.style.strokeDasharray = CIRCUMFERENCE;

      var adIndex = 0;
      var count = 0;

      function animateCount(from, to, duration) {
        var start = null;
        function step(ts) {
          if (start === null) start = ts;
          var progress = Math.min((ts - start) / duration, 1);
          var eased = 1 - Math.pow(1 - progress, 3); // easeOutCubic
          countEl.textContent = Math.round(from + (to - from) * eased);
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      function startRing() {
        ringEl.style.transition = 'none';
        ringEl.style.strokeDashoffset = CIRCUMFERENCE;
        ringEl.getBoundingClientRect(); // 강제 리플로우 — transition 재적용 전에 리셋 반영
        ringEl.style.transition = 'stroke-dashoffset ' + CYCLE_MS + 'ms linear';
        requestAnimationFrame(function () {
          ringEl.style.strokeDashoffset = 0;
        });
      }

      ringEl.addEventListener('transitionend', function (e) {
        if (e.propertyName !== 'stroke-dashoffset') return;

        adIndex = (adIndex + 1) % AD_IMAGES.length;
        imgEl.src = AD_IMAGES[adIndex];

        var newCount = count + COUNT_STEP;
        animateCount(count, newCount, 800);
        count = newCount;
        // TODO: 로딩바가 다 차는 순간 APNG 애니메이션 재생 (파일 전달되면 여기에 연결)

        startRing();
      });

      startRing();
    })();
  </script>
</body>
</html>
